[project]
name = "eot-lab"
version = "0.2.0"
description = "Local German end-of-turn recording and evaluation laboratory"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
  "numpy>=1.26,<3", "scipy>=1.13,<2", "soundfile>=0.12,<1",
  "onnxruntime>=1.19,<2", "huggingface-hub>=0.26,<2",
  "matplotlib>=3.9,<4", "pydantic>=2.9,<3", "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
models = ["silero-vad>=6,<7", "transformers>=4.45,<5", "livekit-local-inference>=0.1,<1", "livekit-agents>=1.6,<2", "aiohttp>=3.11,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
